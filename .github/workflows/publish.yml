name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag_pep440="$(printf '%s' "$tag" | sed -E 's/-beta\.([0-9]+)/b\1/')"
          version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_pep440" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME (normalized $tag_pep440) does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
