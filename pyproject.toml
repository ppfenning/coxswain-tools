[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coxswain-tools"
# Version is set by hand ahead of each release tag; `cox release` bumps the
# coxswain manifest, not this file. 0.1.0b1 is the PEP 440 form of v0.1.0-beta.1.
version = "0.1.0b1"
description = "Provides the `cox` command, the coxswain's operator tools: run records, traces, cleanup, the HUD, plans. `agent-tools` is kept as an alias for one release."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cox = "agent_tools.cli:main"
agent-tools = "agent_tools.cli:main"

[project.urls]
Repository = "https://github.com/ppfenning/coxswain-tools"

[tool.setuptools.packages.find]
include = ["agent_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The harness runs `pytest -q` in a worktree of this repo with an interpreter
# that has the main checkout installed editable. Without this the worktree's
# tests would import the main checkout's package, not the patched one.
pythonpath = ["."]
