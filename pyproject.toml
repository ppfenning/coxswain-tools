[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Provides the `cox` command, the coxswain's operator tools: run records, traces, cleanup, the HUD, plans. `agent-tools` is kept as an alias for one release."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cox = "agent_tools.cli:main"
agent-tools = "agent_tools.cli:main"

[project.urls]
Repository = "https://github.com/ppfenning/agent-tools"

[tool.setuptools.packages.find]
include = ["agent_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The harness runs `pytest -q` in a worktree of this repo with an interpreter
# that has the main checkout installed editable. Without this the worktree's
# tests would import the main checkout's package, not the patched one.
pythonpath = ["."]
